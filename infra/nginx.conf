events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    server {
        listen 80;
        server_name localhost;

        # Serve frontend files directly
        location / {
            root /app/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Enable source map serving for debugging
            location ~* \.map$ {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                expires 0;
            }
        }

        # Serve forms metadata
        location = /forms/metadata {
            root /app/forms;
            try_files /metadata.json =404;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Serve forms from assets/forms folder
        location ^~ /forms/ {
            root /app;
            try_files $uri $uri/ =404;
            # Clear mappings for this location, set a custom type for .vue
            types { }
            default_type text/html;                 # <-- change to whatever content-type you want
            add_header X-Content-Type-Options nosniff always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header access-control-allow-headers "Content-Type";
            add_header access-control-allow-methods "GET, OPTIONS";

        }

        # API (one block only)
        location ^~ /api/ {

            # Handle CORS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 1728000 always;
                return 204;
            }

            # Proxy: replace /api/ with /v1/ on upstream (adjust if you don't want /v1/)
            proxy_pass http://localhost:8080/v1/;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;

            # CORS headers on actual responses
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }

        # API (one block only)
        location ^~ /minio/ {

            # Handle CORS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 1728000 always;
                return 204;
            }

            # Proxy: replace /api/ with /v1/ on upstream (adjust if you don't want /v1/)
            proxy_pass http://localhost:8085/;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;

            # CORS headers on actual responses
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }
    }
}
