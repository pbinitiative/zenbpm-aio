version: "3.8"

networks:
  monitoring:
    driver: bridge

services:
  zenbpm-aio:
    image: ghcr.io/pbinitiative/zenbpm-aio:latest
    platform: linux/amd64
    container_name: zenbpm-aio
    command: ["supervisord", "-c", "/etc/supervisord.conf"]
    ports:
      - "3000:80"      # UI (nginx)
      - "8080:8080"    # HTTP API
      - "9090:9090"    # gRPC
    environment:
      - CONFIG_FILE=/app/conf-infra.yaml
    volumes:
      - ../forms:/app/forms
      - ../node-1:/app/zenbpm/node-1
      - ./conf-infra.yaml:/app/conf-infra.yaml:ro
      - ./supervisord.conf:/etc/supervisord.conf:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./adapter/minio-adapter:/app/minio-adapter/minio-adapter
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/jaeger:2.6.0
    container_name: jaeger
    ports:
      - "4318:4318"    # OTLP HTTP receiver
      - "16686:16686"  # Jaeger UI
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9101:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "9100:3000"
    volumes:
      - ./scripts/grafana_provisioning:/etc/grafana/provisioning
    networks:
      - monitoring

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: ["minio", "server", "/data/minio", "--console-address", ":9001"]
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data/minio
    networks:
      - monitoring

volumes:
  minio-data: {}
